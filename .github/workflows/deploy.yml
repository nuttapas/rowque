name: CI / Deploy

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies (frontend)
        working-directory: frontend
        run: |
          npm ci

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Setup Supabase CLI
        uses: supabase/setup-action@v1
        with:
          version: '1.79.0'

      - name: Supabase login
        run: supabase login --no-localhost --token ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Link project
        run: supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}

      - name: Push database migrations
        run: supabase db push --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}

      - name: Deploy Supabase Edge Functions
        run: |
          supabase functions deploy random-queue --project-ref ${{ secrets.SUPABASE_PROJECT_REF }} --no-verify
          supabase functions deploy call-queue --project-ref ${{ secrets.SUPABASE_PROJECT_REF }} --no-verify
          supabase functions deploy reopen-round --project-ref ${{ secrets.SUPABASE_PROJECT_REF }} --no-verify
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          npm i -g vercel
          cd frontend
          vercel --prod --token $VERCEL_TOKEN --confirm
